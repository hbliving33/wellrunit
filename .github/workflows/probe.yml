name: Probe (temporary)
on: { push: { branches: [main], paths: ['.github/workflows/probe.yml'] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in wellrunit.com www.wellrunit.com; do echo "== $h"; dig +short $h A; dig +short $h CNAME; curl -sSI https://$h/ | grep -iE '^(server|cf-ray|location|strict|content-security)' || true; done
          echo "== NS"; dig +short wellrunit.com NS; echo "== MX"; dig +short wellrunit.com MX
