name: Probe (temporary)
on: { push: { branches: [main], paths: ['.github/workflows/probe.yml'] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== mac feed"; curl -sS https://status.cloud.microsoft/api/feed/mac | head -c 3000; echo
          for f in mso o365 m365 teams exchange sharepoint; do echo "== feed/$f"; curl -sS -o /dev/null -w "%{http_code}\n" https://status.cloud.microsoft/api/feed/$f; done
          echo "== page"; curl -sS https://status.cloud.microsoft/ | grep -o '/api/[a-zA-Z0-9/_-]*' | sort -u | head -20
