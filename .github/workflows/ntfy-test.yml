name: ntfy test (temporary)
on: { push: { branches: [main], paths: ['.github/workflows/ntfy-test.yml'] } }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}' }
    steps:
      - run: |
          echo "Messages in the channel over the last 12 hours (time, title):"
          curl -sS "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=12h" | python3 -c "
          import sys, json, datetime
          for l in sys.stdin:
              m = json.loads(l)
              if m.get('event') == 'message':
                  t = datetime.datetime.fromtimestamp(m['time'], datetime.timezone(datetime.timedelta(hours=-8))).strftime('%I:%M %p PT')
                  print(' ', t, '|', m.get('title', '').split(' at ')[0])
          "
